name: CI

# The deterministic layer is supposed to be exactly reproducible, so this
# workflow deliberately sets no GOOGLE_API_KEY and holds no secret. If a test
# ever needs one, that test has stopped testing the deterministic layer.
#
# Python 3.10 is the floor pyproject.toml commits to; all four are run so the
# floor is a measured claim rather than an aspiration.
#
# Actions are pinned to full commit SHAs, with the release in a trailing
# comment. A tag can be moved to different code after the fact; a SHA cannot.
# It is also the only option for setup-uv, which stopped publishing floating
# major tags: `astral-sh/setup-uv@v10` does not resolve.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so the badge says whether the suite passes now rather than whether
  # it passed at the last push. Dependencies are pinned, but the runner image,
  # uv and the Python builds it downloads are not, and they move without a
  # commit here. Off the hour because GitHub delays top-of-hour schedules under
  # load. GitHub disables schedules on a public repo after 60 days with no
  # activity; a disabled schedule is itself a signal the project went quiet.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    # Pinned, never a -latest alias: the same rule agent.py applies to the
    # model. `ubuntu-latest` moves to 26.04 as a rollout over several weeks from
    # 2026-10-19, so during that window one commit could run on 24.04 in one job
    # and 26.04 in the next. 26.04 is GA and is where the alias is heading; a
    # later image is a deliberate edit here, not something that happens to us.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Explicit rather than v10's `auto`, which only differs by disabling
          # the cache on pull_request_target, workflow_run and release. This
          # workflow runs on none of those.
          enable-cache: true
          # Not optional under a matrix. The cache key embeds this input, and
          # without it falls back to the runner's system Python, so all four
          # jobs computed one identical key, raced to save it, and three
          # warned "Unable to reserve cache". One key per version ends the race.
          python-version: ${{ matrix.python }}

      - name: Run the deterministic layer
        run: uv run --python ${{ matrix.python }} pytest -q

      - name: Assert no model call escaped into the test run
        # tools.py and review.py must never import a model client. This greps
        # the runtime files rather than trusting the suite to notice.
        run: |
          if grep -nE '^\s*(import|from)\s+(google\.genai|google\.adk)' tools.py review.py; then
            echo "::error::a runtime file with a zero-model-call guarantee imports a model client"
            exit 1
          fi
          echo "tools.py and review.py import no model client -- as specified"
